enpal_assessment_project:
  target: dev
  outputs:
    dev:
      type: postgres
      # Defaults match the local docker-compose database; override via env vars elsewhere.
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_PORT', '5432') | as_number }}"
      user: "{{ env_var('DBT_USER', 'admin') }}"
      pass: "{{ env_var('DBT_PASSWORD', 'admin') }}"
      dbname: "{{ env_var('DBT_DATABASE', 'postgres') }}"
      schema: public
      threads: 4
