name: 'enpal_assessment_project'
version: '1.0.0'
profile: 'enpal_assessment_project'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Layering (see README.md):
#   staging      -> 1:1 with Pipedrive source tables; rename, cast, nothing else.   views
#   intermediate -> reusable business transformations (lifecycle resolution,
#                   stage / owner histories). Not exposed to BI.                   views / tables
#   marts        -> consumer-facing dimensions and facts (deal grain, event grain). tables
#   reporting    -> KPI / report models built only on top of marts.                tables
#
# Consumer-facing models (marts, reporting, seeds) land in public_pipedrive_analytics;
# building blocks are kept out of the way in their own schemas.
models:
  enpal_assessment_project:
    staging:
      +schema: pipedrive_staging
      +materialized: view
    intermediate:
      +schema: pipedrive_intermediate
      +materialized: view
    marts:
      +schema: pipedrive_analytics
      +materialized: table
    reporting:
      +schema: pipedrive_analytics
      +materialized: table

seeds:
  enpal_assessment_project:
    +schema: pipedrive_analytics
